        #signals {

        .signal-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid #555;

        .signal-badge {

        .badge-call { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
        .badge-put { background: rgba(255, 59, 92, 0.2); color: #ff3b5c; border: 1px solid rgba(255, 59, 92, 0.3); }

        #status-message {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        .status-box {
            padding: 11px;
            border-radius: 10px;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .status-ready {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .status-waiting {
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.06);
            border: 1px solid rgba(255, 170, 0, 0.2);
        }

        .status-running {
            color: #ff3b5c;
            background: rgba(255, 59, 92, 0.06);
            border: 1px solid rgba(255, 59, 92, 0.2);
        }

<body>

    <div class="app-card">
        <div class="header">

                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.22-3.55 3.91-1.67 4.72-1.96 5.25-1.97.12 0 .39.03.56.17.15.12.19.28.21.4-.02.07-.02.24-.04.41z"/></svg>

<script>
    let lockUntilTimestamp = 0;
    let tradeStartTimestamp = 0;

    const allPairs = [
        "BRLUSD-OTC", "EURUSD-OTC", "GBPUSD-OTC", "AUDUSD-OTC", "USDJPY-OTC", 
        "USDCAD-OTC", "EURGBP-OTC", "AUDJPY-OTC", "NZDUSD-OTC", "USDCHF-OTC", 
        "USDEGP-OTC", "USDIDR-OTC", "USDCOP-OTC", "USDNGN-OTC", "USDPHP-OTC", 
        "USDMXN-OTC", "USDPKR-OTC", "BITCOIN-OTC", "USCRUDE-OTC", "EURUSD", 
        "GBPUSD", "AUDUSD", "USDJPY", "USDCAD", "EURGBP", "AUDJPY", 
        "NZDUSD", "USDCHF", "EURCHF", "EURCAD", "EURAUD", "EURNZD"
    ];

    let selectedPairsSet = new Set();
    let favoritePairsSet = new Set(JSON.parse(localStorage.getItem('tht_fav_stars')) || []);

    function renderPairsUI() {
        const container = document.getElementById('pair-container');
        if (!container) return;
        container.innerHTML = '';

        const sortedPairs = [...allPairs].sort((a, b) => {
            return favoritePairsSet.has(b) - favoritePairsSet.has(a);
        });

        sortedPairs.forEach((pair) => {
            const item = document.createElement('div');
            const isSelected = selectedPairsSet.has(pair);
            const isFav = favoritePairsSet.has(pair);
            
            item.className = `pair-item ${isSelected ? 'selected' : ''}`;
            item.innerHTML = `
                <span>${pair}</span>
                <span class="star-icon ${isFav ? 'active' : ''}">★</span>
            `;

            item.onclick = (e) => {
                if (e.target.classList.contains('star-icon')) {
                    toggleFavorite(e, pair);
                    return;
                }
                if (selectedPairsSet.has(pair)) {
                    selectedPairsSet.delete(pair);
                } else {
                    selectedPairsSet.add(pair);
                }
                updateSelectedCount();
                renderPairsUI();
            };

            container.appendChild(item);
        });
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const countSpan = document.getElementById('selected-count');
        if (countSpan) countSpan.innerText = `${selectedPairsSet.size} Selected`;
    }

    function toggleFavorite(event, pair) {
        event.stopPropagation();
        if (favoritePairsSet.has(pair)) {
            favoritePairsSet.delete(pair);
        } else {
            favoritePairsSet.add(pair);
        }
        localStorage.setItem('tht_fav_stars', JSON.stringify([...favoritePairsSet]));
        renderPairsUI();
    }

    function getQuotexServerTime() {
        const now = new Date();
        return {
            formatted: `${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')}`,
            nowTime: now.getTime()
        };
    }

    setInterval(() => {
        const serverTime = getQuotexServerTime();
        const statusDiv = document.getElementById('status-message');
        const signalBtn = document.getElementById('signal-btn');
        const signalListDiv = document.getElementById('signal-list');

        if (serverTime.nowTime < lockUntilTimestamp) {
            const totalRemaining = Math.ceil((lockUntilTimestamp - serverTime.nowTime) / 1000);
            
            if (signalBtn) {
                signalBtn.disabled = true;
                signalBtn.innerText = `LOCKED (${totalRemaining}s)`;
            }

            if (serverTime.nowTime < tradeStartTimestamp) {
                const entryCountdown = Math.ceil((tradeStartTimestamp - serverTime.nowTime) / 1000);
                if (statusDiv) {
                    statusDiv.innerHTML = `
                        <div class="status-box status-waiting">
                            ⏳ PREPARE ENTRY AT 00 SEC<br>STARTS IN: ${entryCountdown}s
                        </div>
                    `;
                }
            } else {
                const candleRemaining = Math.ceil((lockUntilTimestamp - serverTime.nowTime) / 1000);
                if (statusDiv) {
                    statusDiv.innerHTML = `
                        <div class="status-box status-running">
                            🔴 LIVE CANDLE RUNNING<br>CLOSES IN: ${candleRemaining}s
                        </div>
                    `;
                }
            }

        } else {
            if (lockUntilTimestamp !== 0) {
                if (signalListDiv) signalListDiv.innerHTML = '<span style="font-size: 11px; color: #5d6d7e;">Select pairs to generate signals</span>';
                selectedPairsSet.clear();
                renderPairsUI();
                lockUntilTimestamp = 0;
            }

            if (statusDiv) {
                statusDiv.innerHTML = `<div class="status-box status-ready">UTC SERVER: ${serverTime.formatted} | SYSTEM READY</div>`;
            }
            if (signalBtn) {
                signalBtn.disabled = false;
                signalBtn.innerText = "Get Analysis Signal";
            }
        }
    }, 1000);

    function generateSignal() {
        const now = new Date();
        if (now.getTime() < lockUntilTimestamp) return;

        const pairs = Array.from(selectedPairsSet);
        if (pairs.length === 0) {
            alert("Please select at least one asset pair.");
            return;
        }

        const signalListDiv = document.getElementById('signal-list');
        if (signalListDiv) signalListDiv.innerHTML = ''; 

        let nextMin = now.getUTCMinutes() + 1;
        let nextHr = now.getUTCHours();
        if (nextMin >= 60) { nextMin = 0; nextHr = (nextHr + 1) % 24; }

        const candleStartTime = `${String(nextHr).padStart(2, '0')}:${String(nextMin).padStart(2, '0')}`;

        pairs.forEach(pair => {
            const isOTC = pair.includes("-OTC");
            const sec = now.getUTCSeconds();
            const min = now.getUTCMinutes();
            
            const charSum = pair.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
            const algoScore = isOTC ? (pair.length * 13 + min * 7 + sec) % 100 : (charSum + min * 3 + sec * 9) % 100;

            const direction = (algoScore > 48) ? "CALL" : "PUT";

            const card = document.createElement('div');
            card.className = `signal-card ${direction.toLowerCase()}`;
            card.innerHTML = `
                <div class="signal-info">
                    <div>${candleStartTime} UTC - ${pair}</div>
                </div>
                <div style="text-align: right;">
                    <span class="signal-badge ${direction === 'CALL' ? 'badge-call' : 'badge-put'}">${direction}</span>
                </div>
            `;
            
            if (signalListDiv) signalListDiv.appendChild(card);
        });

        const secondsRemaining = 60 - now.getUTCSeconds();
        tradeStartTimestamp = now.getTime() + (secondsRemaining * 1000);
        lockUntilTimestamp = now.getTime() + ((secondsRemaining + 60) * 1000);
    }

    document.addEventListener('DOMContentLoaded', renderPairsUI);
     
    // Disable Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable F12, Ctrl+U, Ctrl+Shift+I, etc.
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    }
</script>
